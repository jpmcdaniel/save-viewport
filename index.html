<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Viewport</title>
  <style>
    body {
      font-family: sans-serif;
      color: white;
      background-color: #1e1e1e;
      padding: 16px;
      margin: 0;
    }
  </style>
</head>
<body>
  <h3>Save Viewport</h3>
  <p id="status">Connecting to Owlbear Rodeo...</p>

  <!-- Load Owlbear Rodeo SDK v2 -->
  <script src="https://unpkg.com/@owlbear-rodeo/sdk@latest/dist/index.js"></script>
  <script>
    // Wait for the Owlbear Rodeo SDK to be ready
    OBR.onReady(() => {
      document.getElementById('status').innerText = "Connected to room successfully!";
    });
  </script>
</body>
</html>
